<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G. Batista Engineering & Construction</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
    }
    .chat-action {
      padding: 40px 24px;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    .open-chat-button {
      position: relative;
      isolation: isolate;
      display: inline-grid;
      grid-template-columns: 56px minmax(0, 1fr) 40px;
      align-items: center;
      gap: 14px;
      width: 320px;
      max-width: 100%;
      min-height: 88px;
      padding: 14px 16px;
      box-sizing: border-box;
      overflow: hidden;
      border: 1px solid rgba(213, 170, 100, 0.55);
      border-radius: 24px;
      background: linear-gradient(120deg, #092c40, #114c66);
      color: #fff;
      box-shadow: 0 12px 28px -10px rgba(11, 61, 89, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
    }
    .open-chat-button::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      background: radial-gradient(ellipse at top right, rgba(131, 208, 224, 0.18), transparent 65%);
      pointer-events: none;
    }
    .chat-button-avatar {
      width: 56px;
      height: 56px;
      box-sizing: border-box;
      object-fit: cover;
      object-position: 65% center;
      border: 2px solid #e2bd82;
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(226, 189, 130, 0.09);
    }
    .chat-button-copy { display: grid; gap: 5px; min-width: 0; }
    .chat-button-eyebrow {
      color: #e2bd82;
      font-size: 9px;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }
    .chat-button-title { font-size: 18px; font-weight: 600; line-height: 1.25; letter-spacing: -0.3px; }
    .chat-button-arrow {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #e2bd82;
      color: #092c40;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4);
      transition: transform 180ms ease, background 180ms ease;
    }
    .open-chat-button:hover:not(:disabled) {
      transform: translateY(-3px);
      border-color: #e2bd82;
      box-shadow: 0 18px 32px -12px rgba(11, 61, 89, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.16);
    }
    .open-chat-button:hover:not(:disabled) .chat-button-arrow { transform: rotate(-35deg); background: #f0cf9b; }
    .open-chat-button:active:not(:disabled) { transform: translateY(0); }
    .open-chat-button:focus-visible {
      outline: 3px solid #4088b0;
      outline-offset: 4px;
    }
    .open-chat-button:disabled { opacity: 0.7; cursor: wait; }
    .chat-action-status { margin: 12px 0 0 4px; color: #465b68; font-size: 13px; }
    .chat-action-status:empty { display: none; }
    @media (max-width: 380px) {
      .chat-action { padding: 24px 16px; }
      .open-chat-button { grid-template-columns: 48px minmax(0, 1fr) 36px; gap: 10px; padding: 12px; border-radius: 20px; }
      .chat-button-avatar { width: 48px; height: 48px; }
      .chat-button-arrow { width: 36px; height: 36px; }
      .chat-button-title { font-size: 16px; }
      .chat-button-eyebrow { font-size: 8px; letter-spacing: 1px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .open-chat-button, .chat-button-arrow { transition: none; }
      .open-chat-button:hover:not(:disabled),
      .open-chat-button:hover:not(:disabled) .chat-button-arrow { transform: none; }
    }
  </style>
</head>
<body>
  <div class="chat-action">
    <button id="open-chat-button" class="open-chat-button" type="button" aria-label="Chat with Alex" aria-expanded="false" disabled>
      <img class="chat-button-avatar" src="./alex.webp" alt="" width="56" height="56">
      <span class="chat-button-copy">
        <span class="chat-button-eyebrow">Your AI assistant</span>
        <span class="chat-button-title">Chat with Alex</span>
      </span>
      <span class="chat-button-arrow" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14m-6-6 6 6-6 6" />
        </svg>
      </span>
    </button>
    <p id="chat-action-status" class="chat-action-status" role="status">Loading chat&hellip;</p>
  </div>

  <script
    id="retell-widget"
    src="https://dashboard.retellai.com/retell-widget-v2.js"
    type="module"
    data-public-key="public_key_c7d00c4b77230120c528a"
    data-agent-id="agent_e2202fe277ace5ed5adb2c1c6b"
    data-title="Chat with Alex"
    data-bot-name="Alex"
    data-logo-url="./image.png"
    data-fab-icon-url="./alex.webp"
    data-show-ai-popup="false"
    data-auto-open="false"
    data-theme-color="#0b3d59"
    data-color="#0b3d59"
  ></script>

  <script>
    (() => {
      const launcherSelector = 'button[aria-label="Open Assistant"]';
      const openChatButton = document.getElementById('open-chat-button');
      const chatActionStatus = document.getElementById('chat-action-status');
      const styleWidget = () => {
        const shadowRoot = [...document.querySelectorAll('*')]
          .map((element) => element.shadowRoot)
          .find((root) => root?.querySelector(
            `${launcherSelector}, button[aria-label="Minimize window"], a[href*="retellai.com"]`
          ));
        if (!shadowRoot) return false;

        // Use Retell's existing launcher so both buttons open the same session.
        openChatButton.disabled = false;
        chatActionStatus.textContent = '';
        openChatButton.addEventListener('click', () => {
          const launcher = shadowRoot.querySelector(launcherSelector);
          if (launcher) {
            chatActionStatus.textContent = 'Opening chat...';
            launcher.click();
          } else {
            // An already-open chat should stay open when this button is clicked.
            const focusTarget = shadowRoot.querySelector('textarea, input[type="text"], button[aria-label="Close assistant"]');
            focusTarget?.focus();
          }
        });
        const syncOpenChatButton = () => {
          const isOpen = !!shadowRoot.querySelector('button[aria-label="Minimize window"]');
          openChatButton.setAttribute('aria-expanded', String(isOpen));
          if (isOpen) chatActionStatus.textContent = '';
        };
        syncOpenChatButton();

        const style = document.createElement('style');
        style.id = 'gb-widget-style';
        style.textContent = `
          :host {
            --gb-launcher-size: 76px;
            --gb-edge: 20px;
            --gb-right: max(var(--gb-edge), env(safe-area-inset-right));
            --gb-bottom: max(var(--gb-edge), env(safe-area-inset-bottom));
          }

          /* The widget positions its own container independently of its host. */
          [class*="_container_"]:has(> [class*="_bottomStack_"]) {
            right: var(--gb-right) !important;
            bottom: var(--gb-bottom) !important;
          }
          [class*="_bottomStack_"] {
            max-width: calc(100vw - var(--gb-right) - var(--gb-edge)) !important;
          }
          [class*="_window_"] {
            max-width: calc(100vw - var(--gb-right) - var(--gb-edge)) !important;
            box-sizing: border-box !important;
          }

          button[aria-label="Open Assistant"] {
            width: var(--gb-launcher-size) !important;
            min-width: var(--gb-launcher-size) !important;
            max-width: var(--gb-launcher-size) !important;
            height: var(--gb-launcher-size) !important;
            padding: 0 !important;
            gap: 0 !important;
            border-radius: 50% !important;
            background: #0b3d59 !important;
            border: 3px solid #0b3d59 !important;
            box-sizing: border-box !important;
            box-shadow: 0 5px 16px rgba(11, 61, 89, 0.25) !important;
            overflow: hidden !important;
            animation: none !important;
            transition: transform 0.2s ease, box-shadow 0.2s ease !important;
          }
          button[aria-label="Open Assistant"] > span {
            display: none !important;
          }
          button[aria-label="Open Assistant"] > img {
            display: block !important;
            width: 100% !important;
            height: 100% !important;
            flex: 0 0 100% !important;
            object-fit: cover !important;
            object-position: center !important;
            border-radius: 50% !important;
            padding: 0 !important;
            border: 0 !important;
            box-sizing: border-box !important;
          }
          button[aria-label="Open Assistant"]:hover {
            transform: scale(1.04) !important;
            box-shadow: 0 7px 20px rgba(11, 61, 89, 0.32) !important;
          }
          button[aria-label="Open Assistant"]:focus-visible,
          .gb-greeting button:focus-visible {
            outline: 3px solid #4088b0 !important;
            outline-offset: 4px !important;
          }

          /* Preserve the complete portrait logo, with space on every side. */
          img[src$="image.png"] {
            width: 48px !important;
            height: 58px !important;
            flex-shrink: 0 !important;
            object-fit: contain !important;
            object-position: center !important;
            border-radius: 10px !important;
            padding: 6px !important;
            background: #ffffff !important;
            border: 1px solid rgba(11, 61, 89, 0.12) !important;
            box-shadow: 0 2px 6px rgba(11, 61, 89, 0.08) !important;
            box-sizing: border-box !important;
          }

          /* Branded banner inside the chat; native history/close controls stay usable. */
          header.gb-banner-header {
            flex-shrink: 0;
            padding: 12px 14px 16px !important;
            row-gap: 12px;
            background: linear-gradient(125deg, #0b3d59, #165f7b);
            border-bottom: 3px solid #d59a42;
          }
          header.gb-banner-header > button {
            color: #fff !important;
            background: rgba(255, 255, 255, 0.14) !important;
          }
          header.gb-banner-header > button:hover {
            background: rgba(255, 255, 255, 0.24) !important;
          }
          header.gb-banner-header > button:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 3px;
          }
          .gb-chat-banner {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            color: #fff;
            font-family: Arial, sans-serif;
          }
          .gb-chat-banner-copy { flex: 1; min-width: 0; }
          .gb-chat-banner-title {
            display: block;
            font-size: 18px;
            line-height: 1.25;
            font-weight: 700;
          }
          .gb-chat-banner-company {
            margin: 3px 0 0;
            color: #e0edf3;
            font-size: 12px;
            line-height: 1.4;
          }
          .gb-chat-banner-message {
            margin: 8px 0 0;
            color: #fff;
            font-size: 13px;
            line-height: 1.4;
          }
          .gb-chat-banner-avatar {
            display: block;
            flex: 0 0 60px;
            width: 60px;
            height: 60px;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.65);
            border-radius: 50%;
            box-sizing: border-box;
          }
          @media (max-width: 380px), (max-height: 600px) {
            header.gb-banner-header {
              padding: 8px 10px 10px !important;
              row-gap: 6px;
            }
            .gb-chat-banner-title { font-size: 16px; }
            .gb-chat-banner-message { margin-top: 4px; font-size: 12px; }
            .gb-chat-banner-avatar { flex-basis: 48px; width: 48px; height: 48px; }
          }

          .gb-greeting {
            position: fixed;
            right: calc(var(--gb-right) + var(--gb-launcher-size) + 16px);
            bottom: calc(var(--gb-bottom) + var(--gb-launcher-size) / 2);
            transform: translateY(50%);
            max-width: calc(100vw - var(--gb-right) - var(--gb-launcher-size) - 40px);
            z-index: 1000000;
            font-family: Arial, sans-serif;
          }
          .gb-greeting[hidden] { display: none !important; }
          .gb-greeting::after {
            content: '';
            position: absolute;
            right: -6px;
            top: calc(50% - 6px);
            width: 12px;
            height: 12px;
            background: #fff;
            border-top: 1px solid #d5e1e9;
            border-right: 1px solid #d5e1e9;
            transform: rotate(45deg);
            pointer-events: none;
          }
          .gb-greeting-message {
            display: block;
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d5e1e9;
            border-radius: 15px;
            background: #fff;
            color: #0b3d59;
            box-shadow: 0 5px 16px rgba(11, 61, 89, 0.14);
            font: 500 14px/1.4 Arial, sans-serif;
            text-align: left;
            cursor: pointer;
            box-sizing: border-box;
          }
          .gb-greeting-close {
            position: absolute;
            top: -10px;
            left: -9px;
            width: 22px;
            height: 22px;
            padding: 0;
            border: 1px solid #d5e1e9;
            border-radius: 50%;
            background: #fff;
            color: #0b3d59;
            font: 14px/20px Arial, sans-serif;
            cursor: pointer;
          }

          /* Preserve the existing branding visibility. */
          a[href*="retellai.com"],
          div:has(> a[href*="retellai.com"]) {
            display: none !important;
          }

          @media (max-width: 600px) {
            :host { --gb-launcher-size: 68px; --gb-edge: 12px; }
            .gb-greeting-message { padding: 10px 12px; font-size: 13px; }
          }
          @media (prefers-reduced-motion: reduce) {
            button[aria-label="Open Assistant"] { transition: none !important; }
          }
        `;
        shadowRoot.appendChild(style);

        // Keep this outside React's mount so opening chat cannot remove it.
        const greeting = document.createElement('div');
        greeting.className = 'gb-greeting';
        greeting.innerHTML = `
          <button type="button" class="gb-greeting-message">Hi, I'm Alex. <strong>Ask me anything</strong></button>
          <button type="button" class="gb-greeting-close" aria-label="Dismiss greeting">&times;</button>
        `;
        let greetingDismissed = false;
        greeting.querySelector('.gb-greeting-message').addEventListener('click', () => {
          shadowRoot.querySelector(launcherSelector)?.click();
        });
        greeting.querySelector('.gb-greeting-close').addEventListener('click', () => {
          greetingDismissed = true;
          syncGreeting();
        });
        const syncGreeting = () => {
          const hidden = greetingDismissed || !shadowRoot.querySelector(launcherSelector);
          if (greeting.hidden !== hidden) greeting.hidden = hidden;
        };
        shadowRoot.appendChild(greeting);
        syncGreeting();

        const syncBanner = () => {
          // Retell mounts a fresh header after closing/reopening the chat.
          shadowRoot.querySelectorAll('[class*="_window_"] header').forEach((header) => {
            if (header.querySelector('.gb-chat-banner')) return;
            header.classList.add('gb-banner-header');
            const banner = document.createElement('section');
            banner.className = 'gb-chat-banner';
            banner.setAttribute('aria-label', 'G. Batista customer support');
            banner.innerHTML = `
              <div class="gb-chat-banner-copy">
                <strong class="gb-chat-banner-title">G. Batista</strong>
                <p class="gb-chat-banner-company">Engineering &amp; Construction</p>
                <p class="gb-chat-banner-message">Ask Alex about your project.</p>
              </div>
              <img class="gb-chat-banner-avatar" src="./alex.webp" alt="Alex, your AI assistant" width="60" height="60">
            `;
            header.appendChild(banner);
          });
        };
        syncBanner();

        // React replaces the launcher contents on open/back/close. The native
        // image setting keeps Alex on every render; restore the banner as needed.
        new MutationObserver(() => {
          syncGreeting();
          syncBanner();
          syncOpenChatButton();
        }).observe(shadowRoot, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ['aria-label']
        });
        return true;
      };

      const widgetInterval = setInterval(() => {
        if (styleWidget()) clearInterval(widgetInterval);
      }, 100);
      // Avoid polling forever if the third-party script cannot load.
      setTimeout(() => {
        clearInterval(widgetInterval);
        if (openChatButton.disabled) {
          chatActionStatus.textContent = 'Chat could not load. Please refresh the page to try again.';
        }
      }, 30000);
    })();
  </script>

</body>
</html>
