<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G. Batista Engineering & Construction</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
    }
  </style>
</head>
<body>
  
  <script
    id="retell-widget"
    src="https://dashboard.retellai.com/retell-widget-v2.js"
    type="module"
    data-public-key="public_key_c7d00c4b77230120c528a"
    data-agent-id="agent_e2202fe277ace5ed5adb2c1c6b"
    data-title="Chat with Alex"
    data-bot-name="Alex"
    data-logo-url="./image.png"
    data-popup-message="Hi! Need help with your building? Chat with Alex."
    data-show-ai-popup="true"
    data-show-ai-popup-time="4"
    data-auto-open="false"
    data-theme-color="#0b3d59"
    data-color="#0b3d59"
  ></script>

  <script>
    (() => {
      const styleWidget = () => {
        const shadowRoot = [...document.querySelectorAll('*')]
          .map((element) => element.shadowRoot)
          .find((root) => root?.querySelector('img[alt="Support"], img[alt="Alex"], a[href*="retellai.com"]'));
        if (!shadowRoot) return false;
        if (shadowRoot.getElementById('gb-widget-style')) return true;

        const launcherLogo = shadowRoot.querySelector('img[alt="Support"]');
        if (launcherLogo) launcherLogo.src = new URL('./image.png', document.baseURI).href;

        const style = document.createElement('style');
        style.id = 'gb-widget-style';
        style.textContent = `
          /* Keep the whole widget (launcher + open chat window) safely inside
             the page's own edge instead of sitting on top of it or floating
             above the viewport. */
          :host {
            right: 20px !important;
            bottom: 20px !important;
            transform: none !important;
          }

          /* On narrow screens, keep the open panel inside the safe viewport
             width while preserving the desktop spacing and dimensions. */
          @media (max-width: 600px) {
            :host {
              left: auto !important;
              right: max(8px, env(safe-area-inset-right)) !important;
              bottom: max(8px, env(safe-area-inset-bottom)) !important;
              width: calc(100vw - 16px) !important;
              max-width: calc(100vw - 16px) !important;
              box-sizing: border-box !important;
            }

            :host > * {
              width: 100% !important;
              max-width: 100% !important;
            }

            :host [style*="width"] {
              width: min(400px, calc(100vw - 16px)) !important;
              max-width: calc(100vw - 16px) !important;
              box-sizing: border-box !important;
            }

            button:has(img[alt="Support"]) {
              min-width: min(188px, 100%) !important;
            }
          }

          /* Floating launcher with support label */
          button:has(img[alt="Support"]) {
            width: auto !important;
            min-width: 188px !important;
            height: 60px !important;
            padding: 3px 16px 3px 3px !important;
            border-radius: 999px !important;
            background: #0b3d59 !important;
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            box-shadow: 0 9px 22px rgba(11, 61, 89, 0.3), 0 2px 6px rgba(0, 0, 0, 0.13) !important;
            color: #ffffff !important;
            font-size: 14px !important;
            transition: transform 0.2s ease, box-shadow 0.2s ease !important;
          }
          button:has(img[alt="Support"]):hover {
            transform: translateY(-2px) !important;
            box-shadow: 0 13px 27px rgba(11, 61, 89, 0.34), 0 3px 7px rgba(0, 0, 0, 0.14) !important;
          }

          /* Launcher button (closed bubble) — sized so the logo image sits
             fully inside the circle with breathing room, not cropped. */
          img[alt="Support"],
          img[alt="Chat with Alex"] {
            width: 54px !important;
            height: 54px !important;
            object-fit: contain !important;
            object-position: center !important;
            border-radius: 50% !important;
            padding: 6px !important;
            background: #ffffff !important;
            border: 2px solid #ffffff !important;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.14) !important;
            box-sizing: border-box !important;
            transition: transform 0.2s ease, box-shadow 0.2s ease !important;
            cursor: pointer !important;
          }
          img[alt="Support"]:hover,
          img[alt="Chat with Alex"]:hover {
            transform: scale(1.08) !important;
            box-shadow: 0 8px 26px rgba(11, 61, 89, 0.45), 0 3px 8px rgba(0, 0, 0, 0.2) !important;
          }

          /* Header logo inside the open chat window — square box, generous
             padding, contain (not cover) so nothing gets cut off. */
          img[alt="Alex"] {
            width: 40px !important;
            height: 40px !important;
            object-fit: contain !important;
            object-position: center !important;
            border-radius: 8px !important;
            padding: 4px !important;
            background: #ffffff !important;
            border: 1px solid rgba(11, 61, 89, 0.12) !important;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.14) !important;
            box-sizing: border-box !important;
          }

          /* Hide Retell branding link */
          a[href*="retellai.com"] {
            display: none !important;
          }
          a[href*="retellai.com"]::before {
            display: none !important;
          }
          div:has(> a[href*="retellai.com"]) {
            display: none !important;
          }
        `;
        shadowRoot.appendChild(style);
        shadowRoot.querySelector('a[href*="retellai.com"]')?.parentElement.style.setProperty('display', 'none', 'important');
        return true;
      };

      const widgetInterval = setInterval(() => {
        if (styleWidget()) clearInterval(widgetInterval);
      }, 100);
    })();
  </script>

  <style>
    #alex-launcher{position:fixed;right:20px;bottom:20px;z-index:2147483000;display:flex;align-items:flex-end;gap:10px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
    #alex-launcher .alex-greet{position:relative;max-width:190px;background:#fff;color:#0b3a55;border:1px solid #d6e0e8;border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.35;font-weight:600;box-shadow:0 6px 18px rgba(11,58,85,.18);cursor:pointer;margin-bottom:34px}
    #alex-launcher .alex-greet::after{content:"";position:absolute;right:-7px;bottom:18px;width:12px;height:12px;background:#fff;border-right:1px solid #d6e0e8;border-top:1px solid #d6e0e8;transform:rotate(45deg)}
    #alex-launcher .alex-greet button{position:absolute;top:-9px;left:-9px;width:20px;height:20px;border-radius:50%;border:1px solid #d6e0e8;background:#fff;color:#0b3a55;font-size:12px;line-height:1;cursor:pointer;padding:0}
    #alex-launcher .alex-avatar{width:120px;height:120px;border-radius:50%;border:3px solid #0b3a55;background:#fff center/cover no-repeat;box-shadow:0 8px 22px rgba(11,58,85,.35);cursor:pointer;padding:0;flex:none;transition:transform .15s ease}
    #alex-launcher .alex-avatar:hover{transform:scale(1.05)}
    #alex-launcher .alex-avatar:focus-visible,#alex-launcher .alex-greet:focus-visible{outline:3px solid #f28c28;outline-offset:2px}
    @media (max-width:600px){
      #alex-launcher{right:12px;bottom:12px}
      #alex-launcher .alex-avatar{width:86px;height:86px;border-radius:50%}
      #alex-launcher .alex-greet{max-width:150px;font-size:13px;padding:8px 12px}
    }
  </style>

  <div id="alex-launcher" hidden>
    <div class="alex-greet" role="button" tabindex="0" aria-label="Open chat with Alex">
      <button type="button" aria-label="Dismiss greeting">&times;</button>
      Hi, I'm Alex. Ask me anything
    </div>
    <button type="button" class="alex-avatar" aria-label="Chat with Alex, AI assistant"></button>
  </div>

  <script>
    (function () {
      var ALEX_IMG_URL = "./alex.webp";

      var root = document.getElementById("alex-launcher");
      if (!root) return;
      root.querySelector(".alex-avatar").style.backgroundImage = "url('" + ALEX_IMG_URL + "')";

      function deepAll(node, out) {
        out = out || [];
        var kids = node.querySelectorAll ? node.querySelectorAll("*") : [];
        for (var i = 0; i < kids.length; i++) {
          out.push(kids[i]);
          if (kids[i].shadowRoot) deepAll(kids[i].shadowRoot, out);
        }
        return out;
      }
      function findToggle() {
        var all = deepAll(document);
        for (var i = 0; i < all.length; i++) {
          var el = all[i];
          if (root.contains(el)) continue;
          var tag = (el.tagName || "").toLowerCase();
          var isBtn = tag === "button" || el.getAttribute("role") === "button";
          var hasSupportIcon = !!(el.querySelector && el.querySelector('img[alt="Support"]'));
          var sig = ((el.id || "") + " " + (el.className && el.className.toString ? el.className.toString() : "")).toLowerCase();
          var hostSig = "";
          var rn = el.getRootNode && el.getRootNode();
          if (rn && rn.host) hostSig = ((rn.host.id || "") + " " + (rn.host.className || "")).toLowerCase();
          if (isBtn && (hasSupportIcon || sig.indexOf("retell") > -1 || hostSig.indexOf("retell") > -1)) return el;
        }
        for (var j = 0; j < all.length; j++) {
          var h = all[j];
          if (root.contains(h)) continue;
          var s2 = ((h.id || "") + " " + (h.className && h.className.toString ? h.className.toString() : "")).toLowerCase();
          if (s2.indexOf("retell") > -1) {
            var scope = h.shadowRoot || h;
            var b = scope.querySelector && scope.querySelector("button,[role=button]");
            if (b) return b;
          }
        }
        return null;
      }

      var original = null;
      function hideOriginal() {
        if (!original) original = findToggle();
        if (original && !original.__alexHidden) {
          original.style.setProperty("opacity", "0", "important");
          original.style.setProperty("pointer-events", "none", "important");
          original.style.setProperty("right", "-9999px", "important");
          original.style.setProperty("bottom", "-9999px", "important");
          original.__alexHidden = true;
        }
      }

      window.openAlexChat = function () {
        var t = original || findToggle();
        if (t) { t.click(); hideOriginal(); }
        else if (window.console) console.warn("Alex: chat widget not ready yet, try again in a moment.");
        var g = root.querySelector(".alex-greet");
        if (g) g.style.display = "none";
      };

      root.querySelector(".alex-avatar").addEventListener("click", window.openAlexChat);
      var greet = root.querySelector(".alex-greet");
      greet.addEventListener("click", function (e) { if (e.target.tagName !== "BUTTON") window.openAlexChat(); });
      greet.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); window.openAlexChat(); } });
      greet.querySelector("button").addEventListener("click", function (e) { e.stopPropagation(); greet.style.display = "none"; });

      root.hidden = false;

      var tries = 0, timer = setInterval(function () {
        hideOriginal();
        if ((original && original.__alexHidden) || ++tries > 60) clearInterval(timer);
      }, 250);
    })();
  </script>
</body>
</html>
